[package]
name = "cindy-agy-job"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
